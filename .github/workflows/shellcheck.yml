name: ShellCheck

on:
  push:
    paths:
      - "install-remnanode.sh"
      - "tests/test-install-remnanode.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "install-remnanode.sh"
      - "tests/test-install-remnanode.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer
        run: shellcheck install-remnanode.sh tests/test-install-remnanode.sh
      - name: Installer regression tests
        run: bash tests/test-install-remnanode.sh
